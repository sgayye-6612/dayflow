# Runs DayFlow + PostgreSQL on your computer:   docker compose up --build
# Then open http://localhost:8000  (API docs: http://localhost:8000/docs)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
      POSTGRES_DB: dayflow
    volumes:
      - dayflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://dayflow:dayflow@db:5432/dayflow
    depends_on:
      db:
        condition: service_healthy

volumes:
  dayflow-data:
