# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: dayflow
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dayflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # paste your key in the Render dashboard
      - key: DAYFLOW_ACCESS_CODE
        sync: false

databases:
  - name: dayflow-db
    plan: free
